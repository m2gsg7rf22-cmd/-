<!doctype html><html><head><meta charset="utf-8"><title>GameForge humans</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}#c{position:fixed;inset:0}</style></head>
<body><div id="c"></div>
<script type="module">
import * as THREE from '../engine/vendor/three/three.module.js';
import { createRenderer } from '../engine/render/renderer.js';
import { Atmosphere } from '../engine/render/sky.js';
import { pbr } from '../engine/render/materials.js';
import * as H from '../engine/humans.js';
import { CLIP_LIBRARY, CLIP_HELPERS } from '../engine/animation/clips.js';
const customAnim = q2 => q2.get('anim') ? import(q2.get('anim')).then((m) => (typeof m.default === 'function' ? m.default(CLIP_HELPERS) : m.default)) : null;
const q = new URLSearchParams(location.search);
const R = createRenderer({ container: document.getElementById('c') });
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 35), 1, 0.05, 2000);
R.setup(scene, camera);
const atm = new Atmosphere(scene, R.renderer, { timeOfDay: +(q.get('t') || 15.5), sunAzimuth: +(q.get('az') || 160) });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), pbr('concrete', { repeat: 12 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const data = await H.loadHumanData();
const custom = await customAnim(q);
const list = (q.get('who') || 'civilian:1,civilian:2,knight:3,superhero:4,businessperson:5,soldier:6,villager:7,wizard:8').split(',');
const people = [];
list.forEach((w, i) => {
  const [arch, seed] = w.split(':');
  const spec = H.characterFromSpec(arch, +seed);
  if (q.has('hair')) spec.hair = q.get('hair') === 'none' ? null : q.get('hair');
  if (q.has('outfit')) spec.outfit = q.get('outfit');
  if (q.has('sex')) spec.sex = +q.get('sex');
  const h = H.assembleHuman(data, spec);
  h.position.x = (i - (list.length - 1) / 2) * (+(q.get('gap') || 0.85));
  scene.add(h); people.push(h);
  const api = h.userData;
  const clipName = q.get('clip') || 'idle';
  const clip = q.get('bvh') ? H.clipFromBVHCanonical(api.retargeter, data.poses[q.get('bvh')], { name: 'bvh' }) : api.retargeter.clipFromPoseFn(clipName, custom || await_clip(clipName));
  const mixer = new THREE.AnimationMixer(h); const act = mixer.clipAction(clip); act.time = q.has('phase') ? (i / list.length) * clip.duration : i * 0.37; act.play(); if (q.has('phase')) act.timeScale = 0; if (q.has('side')) h.rotation.y = Math.PI / 2;
  api.mixer = mixer; if (q.get('expr')) api.setExpression(q.get('expr')); if (q.get('exprs')) api.setExpression(q.get('exprs').split(',')[i] || 'neutral'); if (q.has('noblink')) api.face.nextBlink = 1e9;
});
function await_clip(n) { return CLIP_LIBRARY[n]; }
camera.position.set(+(q.get('cx') || 0), +(q.get('cy') || 1.45), +(q.get('cz') || 6.5));
camera.lookAt(+(q.get('lx') || 0), +(q.get('ly') || 1.0), 0);
atm.setFocus(new THREE.Vector3());
if (q.has('nofog')) scene.fog = null; if (q.has('noenv')) { atm.pmrem = null; scene.environment = null; } if (q.has('nosky')) atm.sky.visible = false; if (q.has('nostars')) atm.stars.visible = false;
const clock = new THREE.Clock(); let frames = 0;
function loop() { if (window.__pause) return; const dt = Math.min(clock.getDelta(), 0.05); for (const p of people) { p.userData.mixer.update(dt); p.userData.face.update(dt); } R.render(); window.__frames = ++frames; requestAnimationFrame(loop); }
loop(); window.__stats = () => R.stats();
</script>
</body></html>
