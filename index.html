<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121318" />
    <meta name="description" content="BlockForge — a voxel survival sandbox that runs in your browser." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BlockForge</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="BlockForge game view"></canvas>
      <div id="overlay-water" class="screen-fx"></div>
      <div id="overlay-hurt" class="screen-fx"></div>
      <div id="overlay-magma" class="screen-fx"></div>
      <div id="overlay-rift" class="screen-fx"></div>
      <div id="hud" hidden></div>
      <div id="touch" hidden></div>
      <div id="ui"></div>
      <noscript>BlockForge needs JavaScript enabled.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
